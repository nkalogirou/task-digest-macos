name: Feature request
description: Suggest an improvement to Task Digest.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and permission considerations
      description: Would this read, store, or write new Asana/GitHub data?
