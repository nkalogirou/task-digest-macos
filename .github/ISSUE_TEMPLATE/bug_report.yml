name: Bug report
description: Report reproducible Task Digest behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove private task data, repository names, comments, URLs, usernames, and tokens before submitting.
  - type: input
    id: version
    attributes:
      label: Task Digest version or commit
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Python version
      placeholder: macOS 15.5, Python 3.12.4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only reviewed, non-sensitive output from the System page or logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, authentication codes, private task data, organization names, and personal information.
          required: true
